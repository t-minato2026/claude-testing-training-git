#
# ■■■ FaRSeT トレーニング用不具合実装 START ■■■
#
# @bug_id        17
# @bug_title     初期値の誤り
# @author        Sota Toyama
# @see           「FaRSeTトレーニング用のATRSのサンプル不具合の案」
#
# @purpose
# - システムの「気の利かなさ」が、ユーザー体験の質を少しずつ損なっていくことを学習させます。
# - 適切なデフォルト値の設定といった、細やかな配慮の重要性を理解します。
#
# @modification
# - 空席照会画面のフライト種別の初期値を定義しているプロパティ `default.flightType` の値を、
#   `RT`(往復)から `OW`(片道)に変更しました。
#
# @impact
# - 空席照会画面を開いた際に、フライト種別のラジオボタンが「片道」で初期選択されるようになります。
#
# @revert
# - このコメントブロックを削除し、`default.flightType` の値を `OW` から `RT` に戻します。
#
# ■■■ FaRSeT トレーニング用不具合実装 END ■■■
#\u521d\u671f\u30d5\u30e9\u30a4\u30c8\u7a2e\u5225\u30b3\u30fc\u30c9
default.flightType=OW

#\u521d\u671f\u51fa\u767a\u7a7a\u6e2f\u30b3\u30fc\u30c9
default.depAirportCd=HND

#\u521d\u671f\u5230\u7740\u7a7a\u6e2f\u30b3\u30fc\u30c9
default.arrAirportCd=HND

#\u521d\u671f\u642d\u4e57\u30af\u30e9\u30b9\u30b3\u30fc\u30c9
default.boardingClassCd=N